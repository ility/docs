<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="ility">
  <title>ility</title>
  <!-- The brand period from the ility wordmark, as a standalone mark. A fixed
       #5770FF (the brand-500 anchor) rather than a token: the browser loads this
       outside the app's stylesheet, so no CSS variable is in scope. The blue
       holds up against both light and dark browser chrome. -->
  <circle cx="512" cy="512" r="512" fill="#5770FF" />
</svg>
